name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: node --check webapp/static/app.js && node --check webapp/static/sdcwt.js && node --check webapp/static/msrc.js && node --check webapp/static/verify.js

  real-scitt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: mcr.microsoft.com/azurelinux/base/core:3.0
    steps:
      - name: Install system tools
        run: |
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf update -y
          tdnf install -y --disablerepo azurelinux-official-ms-non-oss build-essential ca-certificates curl git jq rpm-build python3-pip nodejs procps tar util-linux zstd
      - uses: actions/checkout@v4
      - name: Cache built SCITT
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/scitt-ci/install
          key: scitt-install-28a3458f5c3ec2c2a00c868a97515fc278150546-ccf-7.0.10-azurelinux-3.0-${{ runner.arch }}
      - name: Run browser-to-SCITT integration
        run: ./scripts/ci-scitt.sh
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-scitt-artifacts
          path: ${{ runner.temp }}/scitt-ci/artifacts