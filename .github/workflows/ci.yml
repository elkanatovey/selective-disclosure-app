name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install checks
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Run checks
        env:
          PYTHON: python
        run: scripts/check.sh

  dev-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build development image
        run: docker build --tag scitt-selective-disclosure-dev .
      - name: Check development tools
        run: |
          docker run --rm scitt-selective-disclosure-dev python3 --version
          docker run --rm scitt-selective-disclosure-dev node --version
          docker run --rm scitt-selective-disclosure-dev shellcheck --version

  real-scitt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: mcr.microsoft.com/azurelinux/base/core:3.0
    steps:
      - name: Install system tools
        run: |
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf update -y
          tdnf install -y --disablerepo azurelinux-official-ms-non-oss build-essential ca-certificates curl git jq rpm-build python3-pip nodejs procps tar util-linux zstd
      - uses: actions/checkout@v7
      - name: Cache built SCITT
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/scitt-ci/install
          key: scitt-install-28a3458f5c3ec2c2a00c868a97515fc278150546-ccf-7.0.10-azurelinux-3.0-${{ runner.arch }}
      - name: Run browser-to-SCITT integration
        run: ./scripts/ci-scitt.sh
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-scitt-artifacts
          path: ${{ runner.temp }}/scitt-ci/artifacts