name: token-core

# CI for the C++ token core (app/src/token) and its cross-language conformance
# tests. The build runs inside CCF's Azure Linux
# base image and installs the official CCF development RPM (no CCF source build).
# The GitHub-hosted runner is only the host that launches the container; the
# build/test steps all execute inside mcr.microsoft.com/azurelinux/base/core:3.0.
on:
  push:
    paths:
      - "app/**"
      - "tools/sd_cwt/**"
      - "spec/**"
      - "scripts/ci-cpp-tests.sh"
      - "scripts/validate-cddl.sh"
      - ".github/workflows/token_core.yml"
  pull_request:
    paths:
      - "app/**"
      - "tools/sd_cwt/**"
      - "spec/**"
      - "scripts/ci-cpp-tests.sh"
      - "scripts/validate-cddl.sh"
      - ".github/workflows/token_core.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: C++ format (clang-format)
    runs-on: ubuntu-latest
    steps:
      # Formatting only needs clang-format and the sources, so it runs on a
      # plain runner rather than the CCF container and gives fast feedback
      # independent of the build/test job below.
      - uses: actions/checkout@v5
      # Pinned to 18 so CI and developers converge on identical output: the
      # .clang-format options here are version-sensitive and a different major
      # version would reformat files this job just passed.
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: clang-format
        run: |
          set -euo pipefail
          files=$(git ls-files app | grep -e '\.h$' -e '\.cpp$')
          if ! echo "$files" | xargs clang-format-18 -n -Werror -style=file; then
            echo "::error::Formatting differs. Fix locally with:"
            echo "  git ls-files app | grep -e '\.h\$' -e '\.cpp\$' | xargs clang-format -style=file -i"
            exit 1
          fi

  cpp-tests:
    name: C++ token core + conformance
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/azurelinux/base/core:3.0
      options: --user root
    env:
      # Released CCF development RPM to install (matches our third_party/CCF).
      CCF_VERSION: "7.0.5"
    steps:
      # The base image ships Microsoft's RPM signing key but does not import it
      # into the gpg keyring, so tdnf's repo metadata check fails with
      # "No public key". Import it first.
      - name: Set up environment (GPG key, base tools, CCF RPM)
        run: |
          set -ex
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf -y update
          tdnf -y install \
            git build-essential cmake ninja-build python3-pip ca-certificates \
            jq which procps tar clang clang-tools-extra-devel ruby
          curl -L "https://github.com/microsoft/CCF/releases/download/ccf-${CCF_VERSION}/ccf_devel_${CCF_VERSION//-/_}_x86_64.rpm" -o ccf.rpm
          tdnf -y install ./ccf.rpm
          rm -f ccf.rpm
          # The reference CDDL (RFC 8610) validator, for spec/ schema checks.
          gem install --no-document cddl

      - uses: actions/checkout@v5
        with:
          # The token adapter compiles against pinned EverCBOR headers while
          # native cryptography still comes from the installed CCF package.
          submodules: true

      - name: Work around git safe.directory in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The ccf_devel RPM installs CCF's CMake package; query the package for
      # the exact config path (fast and deterministic) rather than scanning /.
      - name: Locate CCF install
        id: ccf
        run: |
          set -ex
          cfg=$(rpm -ql ccf_devel | grep -m1 '/ccf-config\.cmake$')
          test -n "$cfg"
          echo "prefix=$(dirname "$(dirname "$cfg")")" >> "$GITHUB_OUTPUT"

      - name: Build + test token core and run Python conformance
        env:
          INSTALL_DIR: ${{ steps.ccf.outputs.prefix }}
          BUILD_DIR: app/build-test
        run: ./scripts/ci-cpp-tests.sh
