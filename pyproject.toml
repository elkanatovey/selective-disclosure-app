[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bug-report-submission"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cbor2>=5.5,<6",
  "cryptography>=46,<47",
  "fastapi>=0.115,<1",
  "pycose>=1.1,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["webapp"]

[tool.setuptools.package-data]
webapp = ["parties.csv", "static/*"]
